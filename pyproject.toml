[project]
name = "gallerywatcher"
version = "1.0.0"
description = "Image Gallery Watcher & Downloader"
license = { text = "MIT" }
authors = [{ name = "Ken Sible", email = "ksible@outlook.com" }]
requires-python = ">=3.11"
dependencies = [
    "gallery-dl>=1.32.17",
    "apscheduler>=3.11.3",
    "cron_descriptor>=2.2.1",
    "requests>=2.34.2",
    "rarfile>=4.5",
]

[dependency-groups]
dev = ["ruff>=0.17.1", "mypy>=2.4.0", "types-requests"]

[project.urls]
homepage = "https://github.com/kennethsible/gallery-watcher"

[project.scripts]
gallery-watcher = "gallerywatcher.main:main"

# [tool.uv.sources]
# gallery-dl = { git = "https://codeberg.org/mikf/gallery-dl.git", rev = "" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
exclude = ['^extractors/']
ignore_missing_imports = true
files = ["src"]

[tool.bandit]
skips = ["B404", "B603"]
exclude_dirs = [".venv", "tests"]
targets = ["src"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"
